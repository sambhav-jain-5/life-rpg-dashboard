<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life RPG Dashboard</title>
<style>
:root{--bg:#070b14;--panel:#101727;--line:#202c45;--text:#eef3ff;--muted:#8d9ab8;--accent:#7c8cff;--good:#55d6a2;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111b32 0,#070b14 45%);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{color:var(--muted);letter-spacing:.12em;font-size:12px;font-weight:700}.title{font-size:42px;font-weight:850;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{background:rgba(16,23,39,.92);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 14px 40px #0003}.label{color:var(--muted);font-size:13px}.num{font-size:30px;font-weight:850;margin-top:7px}.section{margin-top:14px}.section h2{margin:0 0 14px;font-size:19px}.bar{height:9px;background:#202b43;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:linear-gradient(90deg,var(--accent),#9b7cff)}.statrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;background:#1a2540;border:1px solid #293657;border-radius:999px;padding:7px 10px;margin:3px}.event{padding:12px 0;border-bottom:1px solid var(--line)}.event b{display:block}.event small{color:var(--muted)}.empty{color:var(--muted);padding:10px 0}.error{border:1px solid #713c4a;background:#24131b;color:#ffdbe2}.loading{text-align:center;padding:80px;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.top{display:block}.title{font-size:34px}}
@media(max-width:520px){main{padding:16px}.grid{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body><main id="app"><div class="loading">Loading your Life RPG…</div></main>
<script>
const API='https://inrcmhlmnfcqliuscrsr.supabase.co/functions/v1/life-rpg-dashboard-api';
const token=new URLSearchParams(location.search).get('token');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=a=>Math.round(a||0);const h=m=>(m/60).toFixed(1);
async function load(){if(!token){return fail('Open the dashboard from the /dashboard link in Telegram so your private access token is included.')}try{const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Dashboard API error');render(d)}catch(e){fail(e.message)}}
function fail(x){document.getElementById('app').innerHTML='<div class="card error"><h2>Dashboard unavailable</h2><p>'+esc(x)+'</p><p class="muted">Your Telegram bot and Phase 1 data are unaffected.</p></div>'}
function render(d){const s=d.stats||{},a=d.analytics||{},skills=d.skills||[],ach=d.achievements||[],bosses=d.bosses||[],events=d.events||[];document.getElementById('app').innerHTML=`
<div class="top"><div><div class="eyebrow">YOUR PERSONAL LIFE RPG</div><div class="title">🎮 Life RPG</div><div class="muted">Your life, turned into measurable progress.</div></div><div class="muted">Live database</div></div>
<div class="grid">
${[['⭐ XP',s.total_xp||0],['🎮 Level',s.level||1],['🧠 Intelligence',s.intelligence||0],['💪 Fitness',s.fitness||0],['🔥 Discipline',s.discipline||0],['🎯 Focus',s.focus||0],['❤️ Health',s.health||0],['🎨 Creativity',s.creativity||0]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num">${esc(x[1])}</div></div>`).join('')}
</div>
<div class="section card"><h2>📊 Life Overview</h2><div class="grid">${[['Study',a.study_minutes||0,'min'],['Exercise',a.exercise_minutes||0,'min'],['🍛 Meals',a.meals||0,''],['💡 Ideas',a.ideas||0,''],['📝 Events',a.total_events||0,''],['📅 Active days',a.active_days||0,'']].map(x=>`<div><div class="label">${x[0]}</div><div class="num">${esc(x[1])} ${x[2]}</div></div>`).join('')}</div></div>
<div class="grid2 section"><section class="card"><h2>🌳 Skills</h2>${skills.length?skills.map(x=>`<div class="statrow"><b>${esc(x.skill_name)}</b><span class="muted">Lv.${x.level||1} · ${x.xp||0} XP</span></div>`).join(''):'<div class="empty">No skills yet.</div>'}</section><section class="card"><h2>🏆 Achievements</h2>${ach.length?ach.map(x=>`<span class="pill">🏆 ${esc(x.title)}</span>`).join(''):'<div class="empty">No achievements yet.</div>'}</section></div>
<section class="card section"><h2>⚔️ Bosses</h2>${bosses.length?bosses.map(x=>`<div class="statrow"><b>👹 ${esc(x.name)}</b><span>${x.current_hp||0} / ${x.max_hp||0} HP</span></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,100*(1-(x.current_hp||0)/(x.max_hp||1))))}%"></div></div>`).join(''):'<div class="empty">No active bosses.</div>'}</section>
<section class="card section"><h2>📝 Recent Activity</h2>${events.length?events.map(x=>`<div class="event"><b>${esc(x.title||'Logged activity')}</b><small>${esc(x.category||'other')} · ${esc(new Date(x.occurred_at).toLocaleString())}</small></div>`).join(''):'<div class="empty">No activity yet.</div>'}</section>`}
load();
</script></body></html>
